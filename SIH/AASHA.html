<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AASHA - A Ray Of Hope</title>
    <link rel="stylesheet" href="AASHA.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="navbar">
            <video class="logo-video" autoplay loop muted playsinline>
                <source src="AASHA.mp4" type="video/mp4">
            </video>

            <div class="address border">
                <p class="first">Monitoring</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="second"><b>North East</b></p>
                </div>
            </div>

            <div class="search">
                <select class="select">
                    <option>All</option>
                    <option>Risk Zones</option>
                    <option>Alerts</option>
                    <option>Roads</option>
                    <option>Weather</option>
                </select>
                <input placeholder="Search risk zones, roads, alerts..." class="input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="sign-in border">
                <p><span>Hello, Authority</span></p>
                <p class="opt">Account & Alerts</p>
            </div>

            <div class="return border">
                <p><span>Reports &</span></p>
                <p class="opt">Status</p>
            </div>

            <div class="cart border">
                <i class="fa-solid fa-bell"></i>
                <p>Alerts</p>
            </div>
        </div>

        <div class="panel">
            <div class="panel-all">
                <i class="fa-solid fa-bars"></i>
                All
            </div>
            <div class="panel-ops">
                <a href="AASHA.html">Dashboard</a>
                <a href="#">High Risk Zones</a>
                <a href="#">Road Connectivity</a>
                <a href="#">Rainfall Data</a>
                <a href="AASHA_USER_INPUT.html">Upload Report</a>
            </div>
            <div class="other border">
                <i class="fa-solid fa-gear"></i>
                <p>Settings</p>
            </div>
        </div>
    </header>

    <!--white space for Map-->
    <section class="map-section">
        <div class="map-container">
        </div>
    </section>

    <!-- Empty boxes -->
    <section class="data-section">
        <h2>Monitoring Dashboard</h2>
        <div class="boxes-grid">
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
            <div class="box">
                <div class="box-img-placeholder"><i class="fa-regular fa-image"></i></div>
                <div class="box-content">
                    <div class="box-line medium"></div>
                    <div class="box-line short"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>
            NER Landslide Early Warning System &nbsp;|&nbsp;
            <a href="AASHA.html">Dashboard</a>
            <a href="AASHA_USER_INPUT.html">Upload Report</a>
        </p>
    </footer>
</body>

</html>
